<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradient)" stroke="#fff" stroke-width="2"/>
  
  <!-- Running figure silhouette -->
  <!-- Head -->
  <circle cx="50" cy="25" r="6" fill="#fff"/>
  
  <!-- Body -->
  <ellipse cx="50" cy="40" rx="8" ry="12" fill="#fff"/>
  
  <!-- Arms (running motion) -->
  <ellipse cx="42" cy="35" rx="3" ry="8" fill="#fff" transform="rotate(-20 42 35)"/>
  <ellipse cx="58" cy="35" rx="3" ry="8" fill="#fff" transform="rotate(20 58 35)"/>
  
  <!-- Legs (running motion) -->
  <ellipse cx="45" cy="50" rx="4" ry="12" fill="#fff" transform="rotate(-15 45 50)"/>
  <ellipse cx="55" cy="52" rx="4" ry="12" fill="#fff" transform="rotate(25 55 52)"/>
  
  <!-- Motion lines -->
  <line x1="30" y1="45" x2="35" y2="45" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <line x1="30" y1="50" x2="35" y2="50" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <line x1="30" y1="55" x2="35" y2="55" stroke="#fff" stroke-width="2" opacity="0.6"/>
</svg>

