# Docker Compose for Workout Coach Production
# For testing production builds locally before deploying to AWS Lightsail
#
# Usage:
#   1. Copy backend/.env.production.template to backend/.env and fill in values
#   2. Run: docker-compose -f docker-compose.production.yml up --build
#   3. Access frontend at http://localhost:3000
#   4. Access backend API at http://localhost:5000

version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      # Override for local testing
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend static files service (with nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
