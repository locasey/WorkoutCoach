version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: workoutcoach_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workoutcoach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workoutcoach_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: workoutcoach_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@workoutcoach.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - workoutcoach_network

networks:
  workoutcoach_network:
    driver: bridge

volumes:
  postgres_data:

